[project]
name = "mailminder"
version = "0.1.0"
description = "Reads your mailbox with Claude Code or Codex (headless) and turns the dates that matter into calendar events with alerts"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mailminder = "mailminder.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailminder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: talks to the real mailbox / calendar / model; runs only with MAILMINDER_LIVE=1"]
